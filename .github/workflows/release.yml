name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      # 删掉了 解码 jks 的步骤

      - name: 赋予 tv-go 二进制执行权限
        run: |
          chmod +x app/src/main/jniLibs/arm64-v8a/libtvgo.so
          chmod +x app/src/main/jniLibs/armeabi-v7a/libtvgo.so

      - name: 生成apk
        # 【注意】这里改成了 assembleDebug
        run: chmod +x ./gradlew && ./gradlew assembleDebug

      - name: 获取版本号
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >>$GITHUB_OUTPUT

      - name: 重命名应用
        run: |
          for file in app/build/outputs/apk/debug/app-*.apk; do
            if [[ $file =~ app-(.?*)debug.apk ]]; then
              new_file_name="app/build/outputs/apk/debug/mytv-android-${BASH_REMATCH[1]}${{ steps.version.outputs.version }}.apk"
              mv "$file" "$new_file_name"
            fi
          done

      - name: Prepare artifacts
        run: |
          mkdir artifacts
          cp app/build/outputs/apk/debug/*.apk artifacts/

      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          name: v${{ steps.version.outputs.version }}
          token: ${{ secrets.GIT_TOKEN }}
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          omitPrereleaseDuringUpdate: true
          allowUpdates: true
          artifacts: artifacts/*